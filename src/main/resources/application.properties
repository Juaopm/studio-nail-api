server.port=8080
spring.application.name=nail-studio-api

# Configuração do Banco de Dados (Supabase PostgreSQL)
# Substitua as credenciais quando formos conectar de fato
spring.datasource.url=jdbc:postgresql://db.YOUR_SUPABASE_REF.supabase.co:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=SUA_SENHA_DO_SUPABASE

# Configurações do JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect